# Haelt das Gratis-Supabase-Projekt aktiv (wird sonst nach 7 Tagen ohne Nutzung pausiert).
# Ruft alle 3 Tage eine harmlose, oeffentliche Datenbankfunktion auf.
# Am 1. jedes Monats ein leerer Commit, damit GitHub den Zeitplan nicht wegen Inaktivitaet abschaltet.
name: Supabase aktiv halten
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        run: |
          curl -fsS -X POST 'https://tvjozhpqyjqpecqdykrz.supabase.co/rest/v1/rpc/invite_info' \
            -H 'apikey: sb_publishable_dn5u7BCrFO-zfoMxtua-QA_9RzK56UM' -H 'Content-Type: application/json' \
            -d '{"p_token":"keepalive"}'
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - name: Monatlicher Lebenszeichen-Commit
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" -le 03 ]; then
            git config user.name "keepalive"; git config user.email "keepalive@users.noreply.github.com"
            git commit --allow-empty -m "keepalive $(date +%F)" && git push
          fi
